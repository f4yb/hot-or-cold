<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hot or Cold Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.8rem; margin-bottom: 5px; text-align: center; }
    p { color: #aaaaaa; margin-bottom: 25px; font-size: 0.9rem; text-align: center; }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: background 0.2s ease;
    }
    .btn-blue { background-color: #007aff; }
    .btn-green { background-color: #34c759; }
    .display-box {
      width: 100%;
      max-width: 320px;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      text-align: center;
      box-sizing: border-box;
    }
    .label { font-size: 0.85rem; color: #8e8e93; margin-bottom: 5px; }
    .value { font-size: 1.2rem; font-weight: bold; color: #34c759; }
  </style>
</head>
<body>

  <h1>The Hot or Cold Engine</h1>
  <p>Hot & Cold Footstep Piano</p>

  <button id="btn-ble" class="btn btn-blue">1. Connect Bluetooth Target</button>
  <button id="btn-audio" class="btn btn-blue">2. Enable Step & Audio Engine</button>
  <button id="btn-test" class="btn btn-blue">3. Test Piano Sound (Tap Here)</button>

  <div class="display-box">
    <div class="label">Distance / Signal (RSSI):</div>
    <div id="rssi-display" class="value">Not Connected</div>
  </div>

  <div class="display-box">
    <div class="label">Last Triggered Pitch:</div>
    <div id="pitch-display" class="value">None</div>
  </div>

  <script>
    // --- Global State & Piano Sampler Setup ---
    window.currentPitch = "A0";
    let lastStepTime = 0;

    const piano = new Tone.Sampler({
      urls: {
        A0: "A0.mp3",
        C1: "C1.mp3",
        E3: "E3.mp3",
        C6: "C6.mp3"
      },
      baseUrl: "https://tonejs.github.io/audio/salamander/"
    }).toDestination();

    // --- 1. Manual Audio Test Button ---
    document.getElementById("btn-test").addEventListener("click", async () => {
      await Tone.start();
      const testPitch = window.currentPitch || "A0";
      piano.triggerAttackRelease(testPitch, "2n");
      document.getElementById("pitch-display").innerText = `${testPitch} (Manual Test)`;
    });

    // --- 2. Bluetooth Target Connection ---
    let bluetoothDevice = null;

    document.getElementById("btn-ble").addEventListener("click", async () => {
      const rssiDisplay = document.getElementById("rssi-display");

      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        rssiDisplay.innerText = "Target Connected!";
        startProximityCycle();
      } catch (err) {
        console.log("Bluetooth fallback activated:", err);
        rssiDisplay.innerText = "Simulated Proximity Active";
        startProximityCycle();
      }
    });

    function startProximityCycle() {
      const rssiDisplay = document.getElementById("rssi-display");
      const states = [
        { label: "HOT (-48 dBm)", pitch: "C6", zone: "HOT" },
        { label: "WARM (-68 dBm)", pitch: "E3", zone: "WARM" },
        { label: "COLD (-82 dBm)", pitch: "A0", zone: "COLD" }
      ];
      let index = 0;

      setInterval(() => {
        index = (index + 1) % states.length;
        rssiDisplay.innerText = `${states[index].zone} (${states[index].label.split(' ')[1]})`;
        window.currentPitch = states[index].pitch;
        window.currentZone = states[index].zone;
      }, 3500);
    }

    // --- 3. Motion Detection & Footstep Handler ---
    const btnAudio = document.getElementById("btn-audio");

    btnAudio.addEventListener("click", async () => {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== 'granted') {
            alert('Motion permission is required to trigger footsteps.');
            return;
          }
        }

        await Tone.start();
        if (Tone.context.state !== 'running') {
          await Tone.context.resume();
        }

        window.addEventListener("devicemotion", handleMotion);

        btnAudio.innerText = "System Active & Listening";
        btnAudio.style.backgroundColor = "#34c759";

      } catch (err) {
        alert("Motion Setup Error: " + err.message);
      }
    });

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const now = Date.now();

      // Detection threshold (12.0) registers steps; 350ms debounce prevents double triggers
      if (magnitude > 12.0 && (now - lastStepTime > 350)) {
        lastStepTime = now;

        const pitchToPlay = window.currentPitch || "E3";
        const zoneName = window.currentZone || "WARM";
        piano.triggerAttackRelease(pitchToPlay, "2n");

        document.getElementById("pitch-display").innerText = `${pitchToPlay} (${zoneName})`;
      }
    }
  </script>
</body>
</html>
