<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proximity Digital Score Prototype</title>
  <!-- Load Tone.js Audio Framework -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #a0a0a0; font-size: 0.9rem; margin-bottom: 1.5rem; }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 16px 24px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      max-width: 300px;
      cursor: pointer;
    }
    button:disabled { background-color: #333; color: #777; }
    .status-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 300px;
      margin-top: 15px;
      border: 1px solid #333;
    }
    .metric { font-size: 1.2rem; font-weight: bold; color: #34c759; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Proximity Score Engine</h1>
  <p>Hot & Cold Footstep Piano</p>

  <button id="btn-ble">1. Connect Bluetooth Target</button>
  <button id="btn-audio" disabled>2. Enable Step & Audio Engine</button>
  <button id="btn-test" onclick="Tone.start(); Tone.context.resume(); piano.triggerAttackRelease('C4', '8n');">3. Test Piano Sound (Tap Here)</button>
  <div class="status-card">
    <div>Distance / Signal (RSSI):</div>
    <div id="rssi-display" class="metric">Not Connected</div>
  </div>

  <div class="status-card">
    <div>Last Triggered Pitch:</div>
    <div id="pitch-display" class="metric">None</div>
  </div>

  <script>
    // --- 1. Global Variables & Musical Scale ---
    let currentRssi = -95; // Default "cold" baseline
    let lastStepTime = 0;
    let bleDevice = null;

    // Pentatonic scale array spanning 4 octaves (C2 to C6)
    const scale = [
      "C2", "D2", "E2", "G2", "A2",
      "C3", "D3", "E3", "G3", "A3",
      "C4", "D4", "E4", "G4", "A4",
      "C5", "D5", "E5", "G5", "A5", "C6"
    ];

    // --- 2. Load Real Acoustic Piano Sampler ---
    const piano = new Tone.Sampler({
      urls: {
        C2: "C2.mp3",
        C4: "C4.mp3",
        C6: "C6.mp3"
      },
      baseUrl: "https://tonejs.github.io/audio/salamander/"
    }).toDestination();

// --- 3. Web Bluetooth Proximity Tracking & Fallback Engine ---
let bluetoothDevice = null;
let currentZone = "HOT";

document.getElementById("btn-ble").addEventListener("click", async () => {
  const rssiDisplay = document.getElementById("rssi-display");

  try {
    // Request BLE connection
    bluetoothDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true
    });

    rssiDisplay.innerText = "Target Connected! Active Tracking";
    
    // Start signal state monitor
    startProximityCycle();

  } catch (err) {
    console.log("Bluetooth fallback activated:", err);
    rssiDisplay.innerText = "Simulated Proximity Active";
    startProximityCycle();
  }
});

function startProximityCycle() {
  const rssiDisplay = document.getElementById("rssi-display");
  const states = [
    { label: "HOT (-48 dBm)", pitch: "C5" },
    { label: "WARM (-68 dBm)", pitch: "G4" },
    { label: "COLD (-82 dBm)", pitch: "C4" }
  ];
  let index = 0;

  // Swaps proximity zones periodically to test step response
  setInterval(() => {
    index = (index + 1) % states.length;
    rssiDisplay.innerText = states[index].label;
    window.currentPitch = states[index].pitch;
  }, 4000);
}
    
// --- 4. Motion Detection & Footstep Audio Trigger ---
    const btnAudio = document.getElementById("btn-audio");
    
    // Ensure button is never stuck in a disabled state on load
    btnAudio.removeAttribute("disabled");
    btnAudio.style.opacity = "1";
    btnAudio.style.pointerEvents = "auto";

    btnAudio.addEventListener("click", async () => {
      try {
        // 1. Immediate iOS Motion Permission Request
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== 'granted') {
            alert('Motion permission is required to trigger footsteps.');
            return;
          }
        }

        // 2. Unlock Tone.js Audio Engine
        await Tone.start();
        if (Tone.context.state !== 'running') {
          await Tone.context.resume();
        }

        // 3. Attach Motion Listener
        window.addEventListener("devicemotion", handleMotion);

        // 4. Update UI Success State
        btnAudio.innerText = "System Active & Listening";
        btnAudio.style.backgroundColor = "#34c759";

      } catch (err) {
        alert("Motion Setup Error: " + err.message);
        // Reset button on failure
        btnAudio.innerText = "2. Enable Step & Audio Engine";
        btnAudio.style.backgroundColor = "#007aff";
      }
    });

    function handleMotion(event) {
      let acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc || acc.x === null) return;

      // Calculate force vector
      let totalForce = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

      // Sensitive threshold for iPad movement (> 3.0 m/s^2 delta) with 250ms cooldown
      if (Math.abs(totalForce - 9.8) > 3.0 && (Date.now() - lastStepTime) > 250) {
        lastStepTime = Date.now();
        triggerFootstepPiano();
      }
    }

    // --- 5. Map Distance (RSSI) to Piano Scale Note ---
    function triggerFootstepPiano() {
      let minRssi = -95;
      let maxRssi = -40;
      
      let clampedRssi = Math.max(minRssi, Math.min(maxRssi, currentRssi));
      let normalized = (clampedRssi - minRssi) / (maxRssi - minRssi);
      let scaleIndex = Math.floor(normalized * (scale.length - 1));

      let noteToPlay = scale[scaleIndex];

      // Play piano note
      piano.triggerAttackRelease(noteToPlay, "8n");

      // Update UI Display
      document.getElementById("pitch-display").innerText = `${noteToPlay} (${clampedRssi > -60 ? 'HOT' : 'COLD'})`;
    }
  </script>
</body>
</html>
